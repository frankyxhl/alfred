name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Single job on the maintainer's development version (3.12): the
        # coverage gate is precision-bound (pyproject precision = 2), and
        # tracking one interpreter keeps the gate's denominator stable.
        # requires-python stays >=3.10 (pyproject) — the declared minimum
        # is still type-checked by pyright (pinned 3.10) on this same job.
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      # pyrightconfig.json pins pythonVersion 3.10, so types are checked
      # against the minimum supported version on every matrix host.
      # --pythonpath overrides the config's local-.venv package resolution
      # (no .venv exists on CI); the setup-python output is the guaranteed
      # interpreter path, independent of the runner image's PATH symlinks.
      - run: pyright --pythonpath "${{ steps.setup-python.outputs.python-path }}" src/
      - run: pytest --tb=short --cov=src/fx_alfred --cov-report=term-missing --cov-fail-under=95
