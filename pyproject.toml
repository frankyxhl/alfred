[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fx-alfred"
version = "1.28.0"
description = "Alfred — Agent Runbook: workflow routing, SOP checklists, and document management for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["click>=8.0", "pyyaml>=6.0", "wcwidth>=0.2.13"]

[project.optional-dependencies]
dev = ["pytest>=9.0", "pytest-cov", "ruff>=0.15,<0.16", "pyright", "mkdocs-material"]
evolve = ["pytest>=9.0", "pytest-json-report", "pytest-cov"]

[project.scripts]
af = "fx_alfred.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/fx_alfred"]
artifacts = ["src/fx_alfred/rules/*.md", "src/fx_alfred/templates/*.md", "src/fx_alfred/CHANGELOG.md"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/fx_alfred/rules/*.md", "src/fx_alfred/templates/*.md", "src/fx_alfred/CHANGELOG.md"]

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
testpaths = ["tests"]
markers = [
    "unit: pure function or narrow module tests without project-level integration setup",
    "cli: tests that exercise the af command surface or Click command wiring",
    "integration: tests that exercise filesystem, packaging, subprocess, or cross-module behavior",
    "docs: tests that validate document, rule, template, or documentation behavior",
    "slow: intentionally slower tests that may be excluded from tight local loops",
]

[tool.ruff]
target-version = "py310"

[tool.semantic_release]
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_parser = "conventional"
# Build + PyPI upload are handled by publish.yml (release: published trigger);
# semantic-release only versions, tags, and creates the GitHub Release.
build_command = ""
upload_to_pypi = false
upload_to_repository = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
# `docs` bumps patch: bundled SOP documents ship inside the wheel, so a docs
# change is a shippable change for this package.
patch_tags = ["fix", "perf", "docs"]
